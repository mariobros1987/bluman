# ═════════════════════════════════════════════════════════════════════
# BLUMAN ADVISORY PLATFORM — SINGLE SERVER DEPLOYMENT (DOCKER COMPOSE)
# Ideale per VPS Oracle Cloud (Free Tier ARM/x86), AWS EC2, Hetzner, OVH
# ═════════════════════════════════════════════════════════════════════

services:
  # 1. DATABASE POSTGRESQL 16 CON ISOLAMENTO RLS
  postgres:
    image: postgres:16-alpine
    container_name: bluman_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bluman_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bluman_prod}
    volumes:
      - bluman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bluman} -d ${POSTGRES_DB:-bluman_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bluman_internal

  # 2. BACKEND FASTIFY API & MOTORE ADVISORY
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluman_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-bluman}:${POSTGRES_PASSWORD:-bluman_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-bluman_prod}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-bluman}:${POSTGRES_PASSWORD:-bluman_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-bluman_prod}?schema=public
      JWT_SECRET: ${JWT_SECRET:-bluman_super_secret_jwt_key_change_in_production}
    volumes:
      - bluman_uploads:/app/uploads
    networks:
      - bluman_internal
      - bluman_web

  # 3. REVERSE PROXY NGINX (FRONTEND SPA + API ROUTING + SSL)
  nginx:
    image: nginx:alpine
    container_name: bluman_nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - bluman_uploads:/usr/share/nginx/html/uploads:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - bluman_web

volumes:
  bluman_pgdata:
    driver: local
  bluman_uploads:
    driver: local

networks:
  bluman_internal:
    internal: true
  bluman_web:
    driver: bridge
