# ═════════════════════════════════════════════════════════════════════
# BLUMAN ADVISORY PLATFORM — SINGLE SERVER DEPLOYMENT (DOCKER COMPOSE)
# Ideale per VPS Oracle Cloud (Free Tier ARM/x86), AWS EC2, Hetzner, OVH
# ═════════════════════════════════════════════════════════════════════
#
# Regola 6 — i segreti si dichiarano con `${VAR:?...}`, mai con `${VAR:-valore}`.
# La differenza non è stilistica: `:-` fa partire lo stack con il segreto scritto nel
# repository, cioè con una password di database e un JWT_SECRET che chiunque legga
# questo file conosce. Con un JWT_SECRET noto si firma un token per qualsiasi tenant e
# qualsiasi ruolo, e l'isolamento RLS cade con lui, perché `app_tenant_corrente()` si
# fida del tenant che sta nel token. `:?` invece fa fallire `docker compose up` con un
# messaggio: fallisce chiuso e in modo rumoroso, che è l'unico modo accettabile.
#
# Prima del primo avvio serve un file `.env` accanto a questo (non versionato):
#   POSTGRES_USER=…            POSTGRES_DB=…
#   POSTGRES_PASSWORD=$(openssl rand -base64 32)
#   APP_DB_PASSWORD=$(openssl rand -base64 32)   # password del ruolo applicativo bluman_app
#   JWT_SECRET=$(openssl rand -hex 32)
#   WEBHOOK_SECRET_SDI=$(openssl rand -hex 32)   # opzionale, vedi .env.example
#
# ── Isolamento RLS (regola 1) — perché ci sono i servizi `migrate` e `rls` ────────────────
# L'app NON deve connettersi come proprietario dello schema: quel ruolo scavalca le policy
# (rolbypassrls) e l'isolamento multi-tenant sparisce in silenzio. Quindi:
#   - `POSTGRES_USER` è il proprietario: crea lo schema, esegue le migrazioni (DIRECT_URL).
#   - `bluman_app` è il ruolo applicativo, SENZA bypassrls, soggetto alle policy: è quello con
#     cui gira l'API (DATABASE_URL). Lo crea `supabase/migrations/20260819_rls_effettiva.sql`.
# L'ordine di avvio è deterministico (depends_on … service_completed_successfully):
#   postgres (healthy) → migrate (crea le tabelle) → rls (crea bluman_app + policy su TUTTE le
#   tabelle per introspezione) → api (parte come bluman_app). Senza questo, su un DB VPS nuovo
#   l'app girerebbe con l'isolamento RLS spento — vedi checkRls.ts per la verifica.
#
# Questo stack è l'alternativa «tutto su un server» al deployment corrente. La
# distribuzione ufficiale resta quella della regola 9 di .agents/AGENTS.md — backend su
# Railway con `npx --yes @railway/cli up --detach`, frontend su Vercel con il push —
# perché Railway non è agganciato al webhook di GitHub.

services:
  # 1. DATABASE POSTGRESQL 17 CON ISOLAMENTO RLS (major = Supabase di produzione, §4-bis del piano VPS)
  postgres:
    image: postgres:17-alpine
    container_name: bluman_postgres
    restart: unless-stopped
    environment:
      # Valori fra doppi apici: il messaggio di `:?` contiene un due punti seguito da
      # spazio, che in uno scalare YAML non quotato verrebbe letto come una mappa.
      POSTGRES_USER: "${POSTGRES_USER:?manca POSTGRES_USER nel file .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD nel file .env — generala con openssl rand -base64 32}"
      POSTGRES_DB: "${POSTGRES_DB:?manca POSTGRES_DB nel file .env}"
    # pg_stat_statements (dal 02/10/2026): rende visibili le query lente. La libreria si può
    # precaricare solo all'avvio del server, quindi non basta `CREATE EXTENSION`. Dichiarato
    # qui per RIPRODUCIBILITÀ: su un VPS il cui volume esiste già il container non rilegge
    # questa riga, e la si imposta con `ALTER SYSTEM SET shared_preload_libraries=…` (che
    # persiste in postgresql.auto.conf, dentro il volume). I due valori coincidono, e la riga
    # di comando vince sull'auto.conf: restano allineati invece di contraddirsi.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - bluman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bluman_internal

  # 1b. MIGRAZIONI SCHEMA (one-shot, come proprietario) — crea/aggiorna le tabelle prima di RLS e API.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluman_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Proprietario dello schema: `prisma migrate deploy` gira su DIRECT_URL (ruolo con DDL).
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
    command: ["sh", "-c", "npx prisma migrate deploy"]
    restart: "no"
    networks:
      - bluman_internal

  # 1c. PROVISIONING RLS (one-shot) — crea il ruolo applicativo bluman_app (SENZA bypassrls) e applica
  # la policy isolamento_tenant su tutte le tabelle per introspezione. Gira DOPO migrate (le tabelle
  # devono esistere) e PRIMA dell'api. Idempotente: rieseguirlo riallinea la password di bluman_app ad
  # APP_DB_PASSWORD e ridichiara le policy. Usa l'immagine postgres perché ha `psql` (\gexec, :'pw').
  rls:
    image: postgres:17-alpine
    container_name: bluman_rls
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: "${POSTGRES_USER:?manca POSTGRES_USER nel file .env}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD nel file .env}"
      PGDATABASE: "${POSTGRES_DB:?manca POSTGRES_DB nel file .env}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?manca APP_DB_PASSWORD nel file .env — generala con openssl rand -base64 32}"
    volumes:
      - ./supabase/migrations/20260819_rls_effettiva.sql:/rls.sql:ro
    # `$$` sfugge all'interpolazione di compose: la password la espande la shell nel container, così
    # non finisce nel comando reso da `docker inspect`.
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -v pw=\"$$APP_DB_PASSWORD\" -f /rls.sql"]
    restart: "no"
    networks:
      - bluman_internal

  # 1d. POOLER PGBOUNCER (transaction mode) — davanti a Postgres per il RUNTIME dell'app.
  # Sicuro con la RLS del progetto: ogni query è una transazione con `set_config(is_local=true)` + la
  # query sulla STESSA connessione (vedi il commento su DATABASE_URL dell'api). Le migrazioni e il
  # provisioning RLS (owner) NON passano di qui — restano diretti su Postgres 5432.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bluman_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rls:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:?manca POSTGRES_DB nel file .env}"
      DB_USER: bluman_app
      DB_PASSWORD: "${APP_DB_PASSWORD:?manca APP_DB_PASSWORD nel file .env}"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
    networks:
      - bluman_internal

  # 2. BACKEND FASTIFY API & MOTORE ADVISORY
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluman_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Parte solo dopo che le migrazioni e il provisioning RLS sono andati a buon fine: così non
      # esiste una finestra in cui l'API risponde su uno schema incompleto o senza policy attive.
      rls:
        condition: service_completed_successfully
      # Il runtime passa dal pooler: dev'essere su prima dell'API.
      pgbouncer:
        condition: service_started
    # Tutti gli altri secret runtime (SIGILLO_HMAC_SECRET, EMAIL_RELAY_SECRET, SMTP/IMAP, canali,
    # APP_BASE_URL, CORS_ORIGINS, storage…) arrivano dal .env accanto al compose. Le chiavi che
    # `environment` ridefinisce qui sotto (DATABASE_URL/DIRECT_URL) VINCONO sull'env_file: così
    # l'app gira sempre come `bluman_app` sul Postgres locale, mai col DATABASE_URL di sviluppo.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # `DATABASE_URL` è il ruolo applicativo `bluman_app`, SOGGETTO a RLS (regola 1), e passa dal
      # **pooler PgBouncer** (transaction mode). È sicuro col nostro pattern RLS: ogni query gira in
      # una transazione che fa `set_config(..., is_local=true)` + la query INSIEME (prismaClient.ts),
      # quindi il contesto tenant resta sulla stessa connessione del pool. `pgbouncer=true` disattiva
      # i prepared statement, come richiede Prisma in transaction mode. `DIRECT_URL` resta il
      # proprietario, DIRETTO su Postgres (le migrazioni le fa il servizio `migrate`, mai il pooler).
      # NON far coincidere i due: se l'app girasse come proprietario, le policy verrebbero scavalcate.
      DATABASE_URL: "postgresql://bluman_app:${APP_DB_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?schema=public&pgbouncer=true"
      DIRECT_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      JWT_SECRET: "${JWT_SECRET:?manca JWT_SECRET nel file .env — generalo con openssl rand -hex 32}"
      # Vuoto = webhook SDI disattivato, e la rotta risponde 503 invece di accettare
      # chiamate non firmate (vedi .env.example).
      WEBHOOK_SECRET_SDI: "${WEBHOOK_SECRET_SDI:-}"
    # Le migrazioni le esegue il servizio `migrate`; qui si avvia solo il server (si scavalca il CMD
    # del Dockerfile che faceva `migrate deploy && …`, perché bluman_app non ha i privilegi DDL).
    command: ["sh", "-c", "npx tsx src/index.ts"]
    volumes:
      - bluman_uploads:/app/uploads
    networks:
      - bluman_internal
      - bluman_web

  # 3. REVERSE PROXY NGINX (FRONTEND SPA + API ROUTING + SSL)
  nginx:
    image: nginx:alpine
    container_name: bluman_nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Corpo condiviso dei server block :80 e :443. Estensione `.inc` e non `.conf`:
      # nginx carica da solo tutti i `*.conf` di conf.d/, e un secondo `.conf` con un
      # `location` fuori da un `server` farebbe fallire l'avvio.
      - ./nginx_bluman_app.inc:/etc/nginx/conf.d/bluman_app.inc:ro
      # Direttive di proxy condivise dai quattro location che parlano con l'API (`/api/`,
      # `/webhooks/`, `/uploads/`, `/health`). Stesso motivo dell'estensione `.inc` qui sopra.
      - ./nginx_bluman_proxy.inc:/etc/nginx/conf.d/bluman_proxy.inc:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      # Il volume `bluman_uploads` NON si monta qui. Serviti da nginx come file statici, i
      # documenti del vault sarebbero scaricabili da chiunque conoscesse il nome del file:
      # nessun token, nessun tenant, nessuna firma. `GET /uploads/:filename` in
      # src/routes/catalogo.ts pretende il Bearer oppure una firma HMAC a scadenza e
      # verifica il percorso risolto contro il path traversal — quindi /uploads/ va
      # proxato all'API come ogni altra rotta (vedi nginx.conf).
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - bluman_web

  # 4. CERTBOT — rinnovo automatico del certificato TLS (Let's Encrypt).
  # PRIMA EMISSIONE (una tantum, con nginx :80 già su e il dominio che punta al VPS):
  #   docker compose -f docker-compose.prod.yml run --rm --entrypoint \
  #     "certbot certonly --webroot -w /var/www/certbot -d IL.TUO.DOMINIO --email TUA@EMAIL --agree-tos --no-eff-email" certbot
  # Poi in nginx.conf scommenta il blocco server :443 e il `return 301` su :80, sostituisci
  # IL.TUO.DOMINIO, e ricarica: `docker compose exec nginx nginx -s reload`.
  # Da lì in poi questo servizio rinnova da solo (Let's Encrypt scade a 90 giorni).
  certbot:
    image: certbot/certbot:latest
    container_name: bluman_certbot
    restart: unless-stopped
    volumes:
      # Rw (non :ro come su nginx): certbot deve SCRIVERE i certificati emessi/rinnovati.
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Prova il rinnovo ogni 12h; certbot rinnova davvero solo quando mancano <30 giorni.
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    networks:
      - bluman_web

volumes:
  bluman_pgdata:
    driver: local
  bluman_uploads:
    driver: local

networks:
  bluman_internal:
    internal: true
  bluman_web:
    driver: bridge
