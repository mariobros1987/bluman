# ═════════════════════════════════════════════════════════════════════
# BLUMAN — REVERSE PROXY NGINX (SPA + API su una sola origine)
# ═════════════════════════════════════════════════════════════════════
#
# Tre cose in questo file sono già andate storte e hanno una nota che spiega perché:
#
# 1) L'elenco dei prefissi API era stato scritto guardando i NOMI DEI FILE in
#    src/routes/ (`catalogo`, `portale`, `firma`, `stream-notifications`) invece dei
#    PERCORSI DELLE ROTTE. Risultato: una ventina di prefissi reali — `fatture`,
#    `prima-nota`, `conti-bancari`, `portal`, `reports`, `search`, `timesheet`… — non
#    venivano proxati e cadevano su `try_files … /index.html`, cioè il frontend
#    riceveva `200 OK` con dell'HTML dove aspettava del JSON. Un guasto che sembra un
#    bug del frontend e sta invece nel proxy.
#
#    Quel primo rimedio — rigenerare l'elenco dai percorsi reali — non bastava, ed è la
#    parte che vale la pena ricordare: il 02/10/2026 sette PAGINE della SPA si sono
#    rivelate omonime di rotte dell'API (`/portal`, `/reports`, `/invoices`,
#    `/fornitori`, `/timesheet`, `/liquidazione-iva`, `/admin/tenants`), e la regex se le
#    prendeva. L'elenco corretto restava un elenco da tenere corretto. Da allora le API
#    stanno sotto `/api` e l'elenco non esiste più: vedi `nginx/bluman_app.inc`, e il
#    presidio `src/infrastrutturaDeploy.test.ts` che confronta le rotte della SPA con i
#    percorsi serviti in radice — il confronto che mancava.
#
# 2) `/uploads/` era servito staticamente con `alias`. Quel vault contiene i documenti
#    dei clienti: serviti da nginx, chiunque conoscesse il nome del file li scaricava
#    senza token e senza tenant. `GET /uploads/:filename` (src/routes/catalogo.ts)
#    pretende il Bearer oppure una firma HMAC a scadenza e blocca il path traversal:
#    va proxato all'API, non aggirato.
#
# 3) `server_name _;` NON è un catch-all. `_` è un nome letterale: funzionava da
#    catch-all solo perché quel server era l'UNICO su :80, e in assenza di corrispondenze
#    nginx instrada verso il *default server*, che è il primo blocco del socket. Il
#    12/10/2026, aggiungendo il blocco dei nomi di dominio, quel primato è passato a lui:
#    ogni Host sconosciuto — l'indirizzo IP su cui si entrava mentre il DNS di casa non
#    risolveva — ha cominciato a ricevere `301 https://136.144.234.118`, un nome che il
#    certificato non copre, cioè un errore che il browser non lascia aggirare. Da allora
#    il default è DICHIARATO (`default_server`) e non lasciato all'ordine dei blocchi.

# ─────────────────────────────────────────────────────────────────────
# HTTP :80 — DEFAULT SERVER: l'indirizzo IP e qualunque Host sconosciuto.
#
# `default_server` è l'esplicito che mancava: senza, il default è il primo blocco del
# socket, e questo blocco è scritto per primo proprio perché quell'onere resti suo.
#
# Serve una ragione transitoria e misurabile: il resolver della rete di casa non risolve
# `blusmart.eu` (risponde 127.0.0.1, la pagina «dominio inesistente» del provider), quindi
# aprire l'app per IP è l'unica via che funziona da lì. Quando il nome risolverà ovunque,
# il blocco si può togliere — ma la riga `default_server` deve restare da qualche parte,
# altrimenti si torna a dipendere dall'ordine.
# ─────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/conf.d/bluman_app.inc;
}

# ─────────────────────────────────────────────────────────────────────
# HTTP :80 — i nomi del certificato: sfida ACME e redirect a HTTPS.
# ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name blusmart.eu www.blusmart.eu;

    # Sempre in chiaro: è così che Let's Encrypt verifica il dominio. Deve restare
    # raggiungibile per sempre, non solo alla prima emissione: il servizio `certbot` del
    # compose rinnova da sé ogni 12h (`certbot renew --webroot`), e il rinnovo ripassa da
    # qui. È il motivo per cui il redirect qui sotto NON è un `return` a livello di server.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Il redirect vive dentro un `location`, e la posizione conta. `return` e `rewrite`
    # scritti a livello di *server* girano nella fase SERVER_REWRITE, che precede la scelta
    # del location: lì un `return 301` si mangerebbe anche la sfida ACME, e i rinnovi
    # fallirebbero fra 90 giorni senza che nulla lo dica oggi. Verificato il 12/10/2026
    # interrogando il percorso della sfida dopo l'attivazione.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────
# HTTPS :443 — attivo dal 12/10/2026.
#
# Certificato Let's Encrypt per `blusmart.eu` E `www.blusmart.eu` (entrambi i record sono
# pubblicati), scade il 10/01/2027 e lo rinnova il servizio `certbot`. nginx non parte se
# `ssl_certificate` punta a un file che non esiste: per questo il blocco è nato commentato
# e si accende solo dopo la prima emissione.
# ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blusmart.eu www.blusmart.eu;

    ssl_certificate     /etc/letsencrypt/live/blusmart.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blusmart.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: solo su HTTPS, mai sui server :80 (là annuncerebbe una promessa che il
    # deployment non è ancora in grado di mantenere). Vale per il dominio e i suoi
    # sottodomini, non per l'accesso per IP: quello resta in chiaro finché serve.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/bluman_app.inc;
}
