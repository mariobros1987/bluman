<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bluecode Advisory Platform</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0f1117;--sidebar:#161822;--card:#1e2030;--card2:#252840;
  --border:#2a2d3e;--text:#e2e4f0;--muted:#7b7f9e;--hint:#4a4d64;
  --indigo:#6366f1;--indigo-d:#4f52d3;--indigo-l:#818cf8;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;--purple:#a78bfa;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;height:100vh;overflow:hidden;}
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:224px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.logo{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-icon{width:32px;height:32px;background:var(--indigo);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.logo-text{font-size:13px;font-weight:600;}.logo-sub{font-size:10px;color:var(--muted);}
nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;}
.nav-item:hover{background:var(--card);color:var(--text);}
.nav-item.active{background:var(--indigo);color:#fff;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;}
.sidebar-user{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px;}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;color:#fff;}
.user-name{font-size:12px;font-weight:500;}.user-role{font-size:10px;color:var(--muted);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--sidebar);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-title{font-size:14px;font-weight:600;}
.alert-pill{display:flex;align-items:center;gap:6px;background:#2d1a12;border:1px solid #5a3020;color:var(--amber);padding:5px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.content{flex:1;overflow-y:auto;padding:24px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.kpi-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px;}
.kpi-value{font-size:20px;font-weight:700;}.kpi-label{font-size:11px;color:var(--muted);margin-top:2px;}
.kpi-sub{font-size:11px;color:var(--hint);margin-top:3px;}
.alert-banner{background:#1e1510;border:1px solid #4a2a0a;border-radius:12px;padding:14px 16px;margin-bottom:20px;}
.alert-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--amber);margin-bottom:8px;}
.alert-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#d4883a;margin-top:6px;line-height:1.5;}
.alert-dot{width:5px;height:5px;border-radius:50%;background:var(--amber);margin-top:5px;flex-shrink:0;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-title{font-size:13px;font-weight:600;}
.btn-primary{background:var(--indigo);color:#fff;border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;}
.btn-primary:hover{background:var(--indigo-d);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-ghost:hover{color:var(--text);}
.project-list{display:flex;flex-direction:column;gap:10px;}
.project-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .15s;}
.project-card:hover{border-color:var(--indigo);background:var(--card2);}
.project-card.has-delay{border-left:3px solid var(--amber);}
.project-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
.project-name{font-size:13px;font-weight:600;margin-bottom:4px;}
.project-meta{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted);}
.pbar{height:4px;background:var(--border);border-radius:2px;margin:4px 0;}
.pfill{height:4px;border-radius:2px;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.bd{background:rgba(0,0,0,.3);}.bd-dot{width:5px;height:5px;border-radius:50%;}
.pill{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;}
.detail-header{background:var(--sidebar);border-bottom:1px solid var(--border);padding:16px 24px;flex-shrink:0;}
.detail-title{font-size:17px;font-weight:700;}
.detail-meta{display:flex;align-items:center;gap:16px;font-size:11px;color:var(--muted);margin-top:6px;}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-top:12px;}
.tab{padding:9px 16px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.tab:hover{color:var(--text);}.tab.active{color:var(--indigo-l);border-bottom-color:var(--indigo-l);}
.detail-content{flex:1;overflow-y:auto;padding:20px 24px;}
.detail-view{display:flex;flex-direction:column;height:100%;}
.mod-block{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;}
.mod-block.delay-b{border-left:3px solid var(--amber);}
.mod-block.waitdep-b{border-left:3px solid #a78bfa;}
.badge.b-wd{opacity:.9;}
.mod-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
.mod-header:hover{background:var(--card2);}
.chev{color:var(--muted);transition:transform .2s;font-size:11px;}
.chev.open{transform:rotate(90deg);}
.mod-name{font-size:13px;font-weight:600;}
.mod-note{font-size:11px;color:var(--amber);margin-top:3px;}
.mod-right{display:flex;align-items:center;gap:16px;flex-shrink:0;}
.avs{display:flex;}
.avs .av{margin-left:-6px;border:2px solid var(--card);}
.vt{width:100%;border-collapse:collapse;}
.vt th{background:#14162b;font-size:10px;font-weight:600;color:var(--muted);padding:8px 16px;text-align:left;border-top:1px solid var(--border);}
.vt th:not(:first-child){text-align:center;}
.vt td{padding:9px 16px;font-size:12px;border-top:1px solid var(--border);vertical-align:middle;}
.vt td:not(:first-child){text-align:center;}
.vt tr.rd{background:#1a1008;}.vt tr.rb{background:#1a0808;}
.vn{display:flex;align-items:flex-start;gap:8px;}
.vnt{color:var(--text);}.vnt.done{color:var(--hint);text-decoration:line-through;}
.vdn{font-size:10px;color:var(--amber);margin-top:2px;}
.vdb{font-size:10px;color:var(--red);margin-top:2px;}
.ho{color:var(--red);font-weight:600;}.hok{color:var(--green);}.hn{color:var(--hint);}
.mod-foot{background:#14162b;border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);}
.sum-box{background:linear-gradient(135deg,#1a1f3d,#1e2045);border:1px solid #2d3260;border-radius:12px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.cat{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;}
.cA{background:#1a1f3d;color:#818cf8;}.cS{background:#0d2233;color:#60b8f4;}
.cT{background:#200f40;color:#a78bfa;}.cB{background:#0d2d22;color:#34d399;}
.cF{background:#2d2000;color:#f59e0b;}.cL{background:#1e2030;color:#94a3b8;}
.cI{background:#2d0d25;color:#f472b6;}.cC{background:#1a1208;color:#fb923c;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.wizard{background:var(--sidebar);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6);}
.wiz-head{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.wiz-title{font-size:15px;font-weight:600;}
.steps{display:flex;align-items:center;gap:6px;margin-top:12px;}
.sd{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
.sd-done{background:var(--green);color:#fff;}.sd-active{background:var(--indigo);color:#fff;}.sd-todo{background:var(--card2);color:var(--muted);}
.sl{width:32px;height:2px;border-radius:1px;}.sl-done{background:var(--green);}.sl-todo{background:var(--border);}
.wiz-body{flex:1;overflow-y:auto;padding:20px;}
.wiz-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.finput{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;}
.finput:focus{border-color:var(--indigo);}
.flabel{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;}
.type-btns{display:flex;gap:8px;}
.type-btn{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.type-btn.sel{border-color:var(--indigo);background:#1a1f3d;color:var(--indigo-l);}
.mc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;margin-bottom:6px;transition:all .15s;}
.mc:hover{border-color:var(--hint);}.mc.sel{border-color:var(--indigo);background:#1a1f3d;}
.chkbox{width:18px;height:18px;border-radius:5px;border:2px solid var(--hint);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.chkbox.chk{background:var(--indigo);border-color:var(--indigo);}
.closebtn{background:var(--card2);border:none;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:14px;}
.notif{position:fixed;top:20px;right:20px;background:#0d2d22;border:1px solid #1a5c3c;color:#34d399;padding:12px 16px;border-radius:10px;font-size:12px;font-weight:500;z-index:200;display:none;align-items:center;gap:8px;}
.placeholder{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:8px;}
.lib-legend{display:flex;align-items:center;gap:18px;font-size:11px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap;}
.lib-legend-item{display:flex;align-items:center;gap:6px;}
.lib-legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.lib-wrap{position:relative;overflow-x:auto;padding-bottom:12px;}
.lib-graph{display:flex;gap:56px;align-items:flex-start;position:relative;z-index:1;min-width:max-content;padding:4px 4px 4px 4px;}
.lib-col{display:flex;flex-direction:column;gap:22px;width:230px;flex-shrink:0;}
.lib-col-label{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px;display:flex;align-items:center;gap:6px;}
.lib-col-label::after{content:'';flex:1;height:1px;background:var(--border);}
.lib-node{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 14px;cursor:pointer;transition:all .15s;position:relative;}
.lib-node:hover{border-color:var(--indigo);background:var(--card2);transform:translateY(-1px);}
.lib-node.lib-open{border-color:var(--indigo-l);background:var(--card2);}
.lib-node-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.lib-ver{font-size:9px;font-weight:700;color:var(--indigo-l);background:#1a1f3d;border:1px solid #2d3260;padding:1px 6px;border-radius:20px;flex-shrink:0;}
.lib-node-name{font-size:12.5px;font-weight:600;line-height:1.35;margin:6px 0 8px;}
.lib-node-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);}
.lib-node-price{font-weight:700;color:var(--text);}
.lib-node-detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:5px;}
.lib-node-mv{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.lib-node-mv-dot{width:4px;height:4px;border-radius:50%;background:var(--hint);flex-shrink:0;}
.lib-svg{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible;}
.lib-svg path{fill:none;stroke:#3a3d56;stroke-width:1.5;}
.lib-svg path.lib-edge-active{stroke:#6366f1;stroke-width:2;}
.lib-svg circle{fill:#3a3d56;}
.lib-addbtn{border:1.5px dashed var(--border);background:transparent;color:var(--muted);border-radius:12px;padding:12px 14px;font-size:11px;cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif;transition:all .15s;}
.lib-addbtn:hover{color:var(--indigo-l);border-color:var(--indigo);}
.vn{position:relative;cursor:pointer;}
.vn-open{position:absolute;right:0;top:0;font-size:10px;color:var(--indigo-l);opacity:0;transition:opacity .15s;background:var(--card);padding-left:8px;}
.vt tr:hover .vn-open{opacity:1;}
.vt tr:hover{background:var(--card2);}
.proc-modal{background:var(--sidebar);border:1px solid var(--border);border-radius:16px;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6);}
.proc-head{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.proc-title{font-size:15px;font-weight:600;}
.proc-sub{font-size:11px;color:var(--muted);margin-top:4px;}
.proc-toggle{display:flex;gap:8px;margin-top:14px;}
.proc-toggle button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.proc-toggle button.sel{border-color:var(--indigo);background:#1a1f3d;color:var(--indigo-l);}
.proc-body{flex:1;overflow-y:auto;padding:20px;}
.proc-item{display:flex;gap:12px;position:relative;padding-bottom:22px;}
.proc-item:last-child{padding-bottom:0;}
.proc-num-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.proc-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.proc-num.done{background:var(--green);color:#fff;}
.proc-num.pending{background:var(--card2);color:var(--muted);border:1.5px solid var(--border);}
.proc-line{width:2px;flex:1;background:var(--border);margin-top:4px;min-height:14px;}
.proc-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.proc-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.proc-card-title{font-size:12.5px;font-weight:600;}
.proc-card-desc{font-size:11px;color:var(--muted);margin-top:3px;}
.proc-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
.badge-doc{background:#1a1f3d;color:#818cf8;}.badge-form{background:#200f40;color:#a78bfa;}.badge-info{background:#1e2030;color:#94a3b8;}.badge-check{background:#0d2d22;color:#34d399;}
.proc-action{margin-top:10px;}
.proc-upload-btn{background:var(--card2);border:1.5px dashed var(--hint);color:var(--muted);padding:9px 12px;border-radius:8px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;text-align:center;transition:all .15s;}
.proc-upload-btn:hover{border-color:var(--indigo);color:var(--indigo-l);}
.proc-uploaded{display:flex;align-items:center;gap:6px;font-size:11px;color:#34d399;background:#0d2d22;border:1px solid #1a5c3c;border-radius:8px;padding:8px 10px;}
.proc-form-field{margin-bottom:8px;}
.proc-form-field label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;}
.proc-form-field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-size:11px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box;}
.proc-form-field input:focus{border-color:var(--indigo);}
.proc-remove{background:none;border:none;color:var(--hint);cursor:pointer;font-size:13px;padding:2px 4px;flex-shrink:0;}
.proc-remove:hover{color:#ef4444;}
.proc-movebar{display:flex;flex-direction:column;flex-shrink:0;}
.proc-move{background:none;border:none;color:var(--hint);cursor:pointer;font-size:8px;padding:0 3px;line-height:1.6;}
.proc-move:hover:not(:disabled){color:var(--indigo-l);}
.proc-move:disabled{opacity:.2;cursor:default;}
.proc-addbar{border:1.5px dashed var(--border);border-radius:10px;padding:10px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;margin-top:6px;transition:all .15s;}
.proc-addbar:hover{color:var(--indigo-l);border-color:var(--indigo);}
.proc-addform{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px;}
.proc-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:12px;}
</style>
</head>

  {id:"A_RACCOLTA_DOC",n:"Raccolta documentazione cliente",cat:"Analisi",h:2,p:600,ver:2},

function procMoveStep(sid,dir){
  const {v}=getMV();
  const i=v.proc.findIndex(s=>s.id===sid);
  const j=i+dir;
  if(j<0||j>=v.proc.length)return;
  [v.proc[i],v.proc[j]]=[v.proc[j],v.proc[i]];
  refreshProc();
}

function procFileSelected(sid,inputEl){
  const {v}=getMV();

  s.file=f.name;s.fileSize=f.size;s.stato='done';
  refreshProc();
}

function togLib(id){LEX.has(id)?LEX.delete(id):LEX.add(id);render();}

// Risolve le righe di distinta di un modulo negli articoli richiamati (con eventuali override/qty)
function resolveRighe(m){
  return m.righe.map(r=>{
    const art=ARTICOLI.find(a=>a.id===r.art);
    const qty=r.qty||1;
    const h=(r.oO!=null?r.oO:art.h)*qty;
    const p=(r.oP!=null?r.oP:art.p)*qty;
    return {art,qty,h,p,override:(r.oO!=null||r.oP!=null)};
  });
}
function moduloH(m){return resolveRighe(m).reduce((a,r)=>a+r.h,0);}
function moduloP(m){return m.pkg!=null?m.pkg:resolveRighe(m).reduce((a,r)=>a+r.p,0);}

function rLibrary(){
  // livelli topologici: 0 = nessuna dipendenza, N = 1 + max livello delle dipendenze
  const lvl={};
  function levelOf(id){
    if(lvl[id]!==undefined)return lvl[id];
    const m=MLIB.find(x=>x.id===id);
    if(!m||!m.deps.length){lvl[id]=0;return 0;}
    lvl[id]=1+Math.max(...m.deps.map(levelOf));
    return lvl[id];
  }
  MLIB.forEach(m=>levelOf(m.id));
  const maxLvl=Math.max(...Object.values(lvl));
  const cols=[];
  for(let i=0;i<=maxLvl;i++)cols.push(MLIB.filter(m=>lvl[m.id]===i));
  const colLabels=['Punto di partenza','Sbloccati a cascata','Dipendenti'];

  const nodes=cols.map((items,ci)=>{
    const cards=items.map(m=>{
      const open=LEX.has(m.id);
      const dn=m.deps.map(d=>MLIB.find(x=>x.id===d)?.n).filter(Boolean);
      const righe=resolveRighe(m);
      const h=moduloH(m), p=moduloP(m);
      const pkgNote=m.pkg!=null?` · <span style="color:#f0abfc">prezzo pacchetto</span>`:'';
      const detail=open?`<div class="lib-node-detail">${righe.map(r=>`<div class="lib-node-mv"><span class="lib-node-mv-dot"></span>${esc(r.art.n)}${r.qty>1?` <span style="color:#818cf8">×${r.qty}</span>`:''}${r.override?` <span style="color:#f0abfc">(override)</span>`:''}</div>`).join('')}</div>`:'';
      return `<div class="lib-node${open?' lib-open':''}" id="lib-${m.id}" onclick="togLib('${m.id}')">
        <div class="lib-node-top">
          <span class="cat ${catCls(m.cat)}">${m.cat}</span>
          <span class="lib-ver">v${m.ver}</span>
        </div>
        <div class="lib-node-name">${esc(m.n)}</div>
        <div class="lib-node-meta"><span>${h}h · ${righe.length} articoli${dn.length?` · da: ${esc(dn.join(', '))}`:''}</span></div>
        <div class="lib-node-meta" style="margin-top:4px"><span class="lib-node-price">${fmt(p)}</span><span>${open?'▲':'▼'}</span></div>
        ${pkgNote?`<div class="lib-node-meta" style="margin-top:2px;font-size:10px">${pkgNote}</div>`:''}
        ${detail}
      </div>`;
    }).join('');
    return `<div class="lib-col" data-col="${ci}">
      <div class="lib-col-label">${colLabels[ci]||'Livello '+ci}</div>
      ${cards}
      ${ci===0?`<button class="lib-addbtn" onclick="event.stopPropagation()">+ Nuovo modulo</button>`:''}
    </div>`;
  }).join('');

  return `<div class="lib-legend">
    <div class="lib-legend-item"><div class="lib-legend-swatch" style="background:#1a1f3d;border:1px solid #2d3260"></div>Versione del template — congelata nei progetti già avviati</div>
    <div class="lib-legend-item"><div class="lib-legend-swatch" style="background:#3a3d56;height:2px;width:16px;border-radius:0"></div>Dipendenza: il modulo si sblocca solo a monte completato</div>
    <div class="lib-legend-item">Clic su un modulo per vedere gli articoli della distinta — riutilizzabili tra moduli diversi</div>
  </div>
  <div class="lib-wrap" id="lib-wrap">
    <svg class="lib-svg" id="lib-svg"></svg>

    <div class="lib-graph" id="lib-graph">${nodes}</div>
  </div>`;
}

function drawLibEdges(){
  const svg=document.getElementById('lib-svg');
  const wrap=document.getElementById('lib-wrap');
  if(!svg||!wrap)return;
  const wr=wrap.getBoundingClientRect();
  svg.setAttribute('width',wrap.scrollWidth);
  svg.setAttribute('height',wrap.scrollHeight);
  let html='';
  MLIB.forEach(m=>{
    m.deps.forEach(d=>{
      const from=document.getElementById('lib-'+d);
      const to=document.getElementById('lib-'+m.id);
      if(!from||!to)return;
      const fr=from.getBoundingClientRect(),tr=to.getBoundingClientRect();
      const x1=fr.right-wr.left+wrap.scrollLeft,y1=fr.top-wr.top+fr.height/2+wrap.scrollTop;
      const x2=tr.left-wr.left+wrap.scrollLeft,y2=tr.top-wr.top+tr.height/2+wrap.scrollTop;
      const mx=(x1+x2)/2;
      html+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/><circle cx="${x1}" cy="${y1}" r="2.5"/><circle cx="${x2}" cy="${y2}" r="2.5"/>`;
    });
  });
  svg.innerHTML=html;
}
window.addEventListener('resize',()=>{if(V==='library')drawLibEdges();});

    const modName=f.mid?p.mods.find(m=>m.id===f.mid)?.n:null;
    return `<tr style="border-top:1px solid var(--border)">
      <td style="padding:9px 14px;font-size:12px"><span style="color:${tipoCol[f.tipo]};font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.3px">${tipoLbl[f.tipo]}</span><div style="color:var(--muted);margin-top:2px">${esc(f.desc)}${modName?` · ${esc(modName)}`:''}</div></td>
      <td style="padding:9px;text-align:center;font-size:11px;color:${stStyle[f.stato]}">${f.stato}</td>
      <td style="padding:9px 14px;text-align:right;font-weight:600">${fmt(f.importo)}</td>
    </tr>`;
  }).join(''):'<tr><td colspan="3" style="padding:14px;text-align:center;font-size:11px;color:var(--hint);font-style:italic">Nessuna fattura emessa</td></tr>';

  const rows=p.mods.map(m=>{
    const fatturatoModulo=fatture.filter(f=>f.mid===m.id).reduce((a,f)=>a+(f.pct?f.importo:(f.tipo==='modulo_completo'?f.importo:0)),0);
    const p_mod=moduloP(m);
    return `<tr style="border-top:1px solid var(--border)"><td style="padding:9px 14px;font-size:12px">${esc(m.n)}</td><td style="padding:9px;text-align:center">${badge(m.st)}</td><td style="padding:9px 14px;text-align:right;font-weight:600">${fmt(p_mod)}</td><td style="padding:9px 14px;text-align:right;color:${fatturatoModulo>0?'#34d399':'var(--muted)'}">${fatturatoModulo>0?fmt(fatturatoModulo):'—'}</td></tr>`;
  }).join('');

  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <span style="font-size:10px;color:var(--muted)">Canale fatturazione:</span>
    <span style="font-size:11px;font-weight:600;color:${canaleCol}">● ${canaleLbl}</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">
    ${[['Valore totale',p.val,'var(--text)'],['Fatturato',fatturato,'#10b981'],['Da fatturare',daFatturare,'#818cf8']].map(([l,v,c])=>`<div class="card"><div style="padding:14px 16px"><div style="font-size:10px;color:var(--muted);margin-bottom:6px">${l}</div><div style="font-size:20px;font-weight:700;color:${c}">${fmt(v)}</div></div></div>`).join('')}
  </div>
  <div class="card" style="margin-bottom:12px"><div style="padding:12px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600">Fatture emesse</div>
    <table style="width:100%;border-collapse:collapse"><thead><tr style="background:#14162b"><th style="text-align:left;padding:8px 14px;font-size:10px;color:var(--muted);font-weight:600">Tipo / descrizione</th><th style="padding:8px;font-size:10px;color:var(--muted);font-weight:600">Stato</th><th style="text-align:right;padding:8px 14px;font-size:10px;color:var(--muted);font-weight:600">Importo</th></tr></thead><tbody>${righeFatt}</tbody></table>
  </div>
  <div class="card"><div style="padding:12px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600">Breakdown per modulo</div>
    <table style="width:100%;border-collapse:collapse"><thead><tr style="background:#14162b"><th style="text-align:left;padding:8px 14px;font-size:10px;color:var(--muted);font-weight:600">Modulo</th><th style="padding:8px;font-size:10px;color:var(--muted);font-weight:600">Stato</th><th style="text-align:right;padding:8px 14px;font-size:10px;color:var(--muted);font-weight:600">Valore</th><th style="text-align:right;padding:8px 14px;font-size:10px;color:var(--muted);font-weight:600">Fatturato</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function rPlaceholder(){
  const m={clients:{e:'👥',t:'Clienti',s:'Anagrafica clienti e gestione CRM'},calendar:{e:'📅',t:'Calendario',s:'Impegni e scadenze del team'},library:{e:'📚',t:'Libreria moduli',s:'Configura e gestisci i template dei moduli'},settings:{e:'⚙️',t:'Impostazioni',s:'Utenti, permessi e configurazione'}};
  const d=m[V]||{e:'🔧',t:'',s:''};
  return `<div class="placeholder"><div style="font-size:40px">${d.e}</div><div style="font-size:13px;font-weight:500;color:var(--muted)">${d.t}</div><div style="font-size:11px;color:var(--hint)">${d.s}</div><div style="margin-top:10px;font-size:10px;color:#4a4d64">Disponibile nella versione completa</div></div>`;
}

function rWiz(){
  const sel=[...WM].map(id=>MLIB.find(m=>m.id===id)).filter(Boolean);
  const tP=sel.reduce((a,m)=>a+moduloP(m),0),tH=sel.reduce((a,m)=>a+moduloH(m),0);
  const sd=n=>`<div class="sd ${n<WS?'sd-done':n===WS?'sd-active':'sd-todo'}">${n<WS?'✓':n}</div>`;
  const sl=n=>`<div class="sl ${n<WS?'sl-done':'sl-todo'}"></div>`;
  let body='';
  if(WS===1){
    body=`<div style="display:flex;flex-direction:column;gap:14px">
      <div><div class="flabel">Nome cliente *</div><input class="finput" id="wc" placeholder="es. Marco Rossi / Acme S.r.l." value="${esc(WCL)}" oninput="WCL=this.value"></div>
      <div><div class="flabel">Tipo cliente</div><div class="type-btns"><button class="type-btn${WTP==='individual'?' sel':''}" onclick="WTP='individual';document.querySelectorAll('.type-btn').forEach((b,i)=>{b.classList.toggle('sel',i===0)})">👤 Persona fisica</button><button class="type-btn${WTP==='company'?' sel':''}" onclick="WTP='company';document.querySelectorAll('.type-btn').forEach((b,i)=>{b.classList.toggle('sel',i===1)})">🏢 Società</button></div></div>
      <div><div class="flabel">Nome progetto *</div><input class="finput" id="wp" placeholder="es. Struttura Holding — Famiglia Rossi" value="${esc(WPN)}" oninput="WPN=this.value"></div>
      <div style="background:#1a1f3d;border:1px solid #2d3260;border-radius:8px;padding:10px 12px;font-size:11px;color:#818cf8">💡 <strong>Tip:</strong> Parti con il modulo <em>Analisi patrimoniale iniziale</em> per validare la struttura con il cliente prima del progetto completo.</div>
    </div>`;
  } else if(WS===2){
    const cats=[...new Set(MLIB.map(m=>m.cat))];
    body=cats.map(cat=>{
      const items=MLIB.filter(m=>m.cat===cat).map(m=>{
        const s=WM.has(m.id);
        return `<div class="mc${s?' sel':''}" onclick="togWM('${m.id}')">
          <div class="chkbox${s?' chk':''}">${s?'<span style="color:#fff;font-size:10px">✓</span>':''}</div>
          <div style="flex:1"><div style="font-size:12px;font-weight:500">${esc(m.n)}</div><div style="font-size:10px;color:var(--muted)">${m.righe.length} articoli · ${moduloH(m)}h</div></div>
          <div style="font-size:12px;font-weight:600;flex-shrink:0">${fmt(moduloP(m))}</div>
        </div>`;
      }).join('');
      return `<div style="margin-bottom:14px"><span class="cat ${catCls(cat)}" style="display:inline-block;margin-bottom:8px">${cat}</span>${items}</div>`;
    }).join('');
  } else {
    const rows=sel.map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><div><div style="font-size:12px;font-weight:500">${esc(m.n)}</div><span class="cat ${catCls(m.cat)}" style="margin-top:3px;display:inline-block">${m.cat}</span></div><div style="text-align:right"><div style="font-size:12px;font-weight:600">${fmt(moduloP(m))}</div><div style="font-size:10px;color:var(--muted)">${moduloH(m)}h</div></div></div>`).join('');
    body=`<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px">${[['Cliente',WCL||'—'],['Tipo',WTP==='individual'?'Persona fisica':'Società'],['Progetto',WPN||'—'],['Moduli',sel.length],['Ore totali',tH+'h']].map(([l,v])=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted)">${l}</span><strong>${v}</strong></div>`).join('')}</div>
    ${rows}
    <div class="sum-box" style="margin-top:12px"><div><div style="font-size:11px;color:#818cf8;opacity:.8">Valore totale progetto</div><div style="font-size:11px;color:#818cf8;opacity:.6;margin-top:2px">${tH}h · ${sel.length} moduli</div></div><div style="font-size:24px;font-weight:800;color:#fff">${fmt(tP)}</div></div>
    <div style="background:#0d2d22;border:1px solid #1a5c3c;border-radius:8px;padding:10px 12px;font-size:11px;color:#34d399;margin-top:12px">✓ Alla creazione verrà generata una <strong>engagement letter</strong> da inviare al cliente per firma digitale.</div>`;
  }
  const canN=WS===1?(WCL.trim()&&WPN.trim()):WS===2?(WM.size>0):true;
  return `<div class="overlay" id="wiz-ov" onclick="clsWizOuter(event)">
    <div class="wizard">
      <div class="wiz-head">
        <div>
          <div class="wiz-title">Nuovo progetto</div>
          <div class="steps">${sd(1)}${sl(1)}${sd(2)}${sl(2)}${sd(3)}<span style="font-size:10px;color:var(--muted);margin-left:8px">${['','Cliente','Selezione moduli','Riepilogo'][WS]}</span></div>
        </div>
        <button class="closebtn" onclick="clsWiz()">✕</button>
      </div>
      <div class="wiz-body">${body}</div>
      <div class="wiz-foot">
        <button class="btn-ghost" onclick="${WS>1?'wBack()':'clsWiz()'}">${WS>1?'← Indietro':'Annulla'}</button>
        <button class="btn-primary" onclick="wNext()" ${!canN?'style="opacity:.4;cursor:not-allowed"':''}>${WS===3?'✓ Crea progetto':'Avanti →'}</button>
      </div>
    </div>
  </div>`;
}

function nav(v){if(v!=='project')P=null;V=v;TAB='moduli';render();}
function openP(id){P=PROJECTS.find(p=>p.id===id);V='project';EX=new Set([P.mods[0]?.id]);TAB='moduli';render();}
function setT(t){TAB=t;render();}
function togM(id){EX.has(id)?EX.delete(id):EX.add(id);render();}
function openWiz(){WO=true;WS=1;WCL='';WPN='';WM=new Set();render();}
function clsWiz(){WO=false;const o=document.getElementById('wiz-ov');if(o)o.remove();}
function clsWizOuter(e){if(e.target.id==='wiz-ov')clsWiz();}
function togWM(id){WM.has(id)?WM.delete(id):WM.add(id);const o=document.getElementById('wiz-ov');if(o)o.remove();WO=true;document.getElementById('app').insertAdjacentHTML('beforeend',rWiz());}
function wNext(){
  if(WS===1){const c=document.getElementById('wc'),p=document.getElementById('wp');if(c)WCL=c.value;if(p)WPN=p.value;if(!WCL.trim()||!WPN.trim())return;WS=2;}
  else if(WS===2){if(WM.size===0)return;WS=3;}
  else{clsWiz();const n=document.getElementById('notif');n.style.display='flex';setTimeout(()=>{n.style.display='none';},3500);return;}
  const o=document.getElementById('wiz-ov');if(o)o.remove();WO=true;document.getElementById('app').insertAdjacentHTML('beforeend',rWiz());
}
function wBack(){WS--;const o=document.getElementById('wiz-ov');if(o)o.remove();WO=true;document.getElementById('app').insertAdjacentHTML('beforeend',rWiz());}

render();
</script>
</body>
</html>
