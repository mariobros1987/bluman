server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50M;

    # Let's Encrypt challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API Proxy Fastify
    location ~ ^/(auth|tenant|catalogo|clienti|progetti|contabilita|documenti|documenti-template|fornitori|fatture-ricevute|liquidazione-iva|invoices|portale|firma|notifiche|webhooks|stream|stream-notifications|health) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Uploads Vault
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex off;
    }

    # Frontend Single Page Application (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
