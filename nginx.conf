# ═════════════════════════════════════════════════════════════════════
# BLUMAN — REVERSE PROXY NGINX (SPA + API su una sola origine)
# ═════════════════════════════════════════════════════════════════════
#
# Due cose in questo file sono già andate storte e hanno una nota che spiega perché:
#
# 1) L'elenco dei prefissi API era stato scritto guardando i NOMI DEI FILE in
#    src/routes/ (`catalogo`, `portale`, `firma`, `stream-notifications`) invece dei
#    PERCORSI DELLE ROTTE. Risultato: una ventina di prefissi reali — `fatture`,
#    `prima-nota`, `conti-bancari`, `portal`, `reports`, `search`, `timesheet`… — non
#    venivano proxati e cadevano su `try_files … /index.html`, cioè il frontend
#    riceveva `200 OK` con dell'HTML dove aspettava del JSON. Un guasto che sembra un
#    bug del frontend e sta invece nel proxy.
#
#    Quel primo rimedio — rigenerare l'elenco dai percorsi reali — non bastava, ed è la
#    parte che vale la pena ricordare: il 02/10/2026 sette PAGINE della SPA si sono
#    rivelate omonime di rotte dell'API (`/portal`, `/reports`, `/invoices`,
#    `/fornitori`, `/timesheet`, `/liquidazione-iva`, `/admin/tenants`), e la regex se le
#    prendeva. L'elenco corretto restava un elenco da tenere corretto. Da allora le API
#    stanno sotto `/api` e l'elenco non esiste più: vedi `nginx_bluman_app.inc`, e il
#    presidio `src/infrastrutturaDeploy.test.ts` che confronta le rotte della SPA con i
#    percorsi serviti in radice — il confronto che mancava.
#
# 2) `/uploads/` era servito staticamente con `alias`. Quel vault contiene i documenti
#    dei clienti: serviti da nginx, chiunque conoscesse il nome del file li scaricava
#    senza token e senza tenant. `GET /uploads/:filename` (src/routes/catalogo.ts)
#    pretende il Bearer oppure una firma HMAC a scadenza e blocca il path traversal:
#    va proxato all'API, non aggirato.

# ─────────────────────────────────────────────────────────────────────
# HTTP :80 — sfida ACME, redirect a HTTPS, e null'altro
# ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Sempre in chiaro: è così che Let's Encrypt verifica il dominio.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Finché il certificato non esiste, questo redirect manderebbe il browser su una
    # porta 443 che non risponde. Il primo avvio si fa quindi con il blocco HTTPS in
    # fondo ancora commentato e QUESTA riga commentata, si ottiene il certificato con
    #   docker compose -f docker-compose.prod.yml run --rm --entrypoint "\
    #     certbot certonly --webroot -w /var/www/certbot -d IL.TUO.DOMINIO" certbot
    # e solo dopo si scommentano entrambi e si ricarica nginx. Lasciarlo commentato in
    # produzione significa far viaggiare i JWT e i documenti in chiaro.
    # return 301 https://$host$request_uri;

    include /etc/nginx/conf.d/bluman_app.inc;
}

# ─────────────────────────────────────────────────────────────────────
# HTTPS :443 — da scommentare dopo la prima emissione del certificato
# ─────────────────────────────────────────────────────────────────────
# nginx non parte se `ssl_certificate` punta a un file che non esiste: per questo il
# blocco nasce commentato invece di essere «già pronto» e rompere il primo `up`.
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name IL.TUO.DOMINIO;
#
#     ssl_certificate     /etc/letsencrypt/live/IL.TUO.DOMINIO/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/IL.TUO.DOMINIO/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     # HSTS: solo su HTTPS, mai sul server :80 (là annuncerebbe una promessa che il
#     # deployment non è ancora in grado di mantenere).
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     include /etc/nginx/conf.d/bluman_app.inc;
# }
